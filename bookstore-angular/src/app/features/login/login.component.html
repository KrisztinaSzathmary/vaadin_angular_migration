<div class="flex h-screen">
  <!-- Left sidebar -->
  <div
    class="hidden w-sidebar bg-[#6B8AFF] p-8 text-white sm:flex sm:flex-col"
  >
    <h1 class="mb-4 text-2xl font-bold text-black">Login information</h1>
    <p class="text-sm leading-relaxed">
      Log in as &quot;admin&quot; to have full access. Log in with any other
      username to have read-only access. For all users, the password is same as
      the username.
    </p>
  </div>

  <!-- Right area -->
  <div class="flex flex-1 items-center justify-center">
    <form
      [formGroup]="loginForm"
      (ngSubmit)="onSubmit()"
      class="flex w-80 flex-col gap-5"
    >
      <h2 class="mb-2 text-2xl font-bold">Login</h2>

      <!-- Username -->
      <div class="flex flex-col gap-1">
        <label for="username" class="text-sm font-medium text-gray-700">
          Username <span class="text-red-500">&bull;</span>
        </label>
        <input
          id="username"
          formControlName="username"
          autocomplete="username"
          class="rounded border border-gray-300 bg-gray-50 px-3 py-2 text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none"
        />
      </div>

      <!-- Password -->
      <div class="flex flex-col gap-1">
        <label for="password" class="text-sm font-medium text-gray-700">
          Password <span class="text-red-500">&bull;</span>
        </label>
        <div class="relative">
          <input
            id="password"
            formControlName="password"
            [type]="hidePassword() ? 'password' : 'text'"
            autocomplete="current-password"
            class="w-full rounded border border-gray-300 bg-gray-50 px-3 py-2 pr-10 text-sm focus:border-blue-500 focus:ring-1 focus:ring-blue-500 focus:outline-none"
          />
          <button
            type="button"
            (click)="hidePassword.set(!hidePassword())"
            [attr.aria-label]="
              hidePassword() ? 'Show password' : 'Hide password'
            "
            class="absolute right-2 top-1/2 flex -translate-y-1/2 items-center text-gray-400 hover:text-gray-600"
          >
            <mat-icon class="text-[20px]">{{
              hidePassword() ? "visibility" : "visibility_off"
            }}</mat-icon>
          </button>
        </div>
      </div>

      @if (errorMessage()) {
        <p class="text-sm text-red-600">{{ errorMessage() }}</p>
      }

      <button
        mat-flat-button
        color="primary"
        type="submit"
        class="w-full"
        [disabled]="loginForm.invalid || isLoading()"
      >
        {{ isLoading() ? "Logging in..." : "Log in" }}
      </button>

      <a class="cursor-pointer text-center text-sm text-blue-600"
        >Forgot password</a
      >
    </form>
  </div>
</div>
